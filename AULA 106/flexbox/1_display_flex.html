<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      body {
        background-color: black;
      }
      .container-flex {
        border: 4px solid blue;
        display: flex;
        width: 360px;
        height: 300px;
        /*flex-direction: column;*/
        /*flex-wrap: wrap;
        overflow-x: scroll;*/
        flex-flow: column wrap;
      }
      .container-flex > div {
        border: 4px solid white;
        color: white;
        padding: 4px;
        margin: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Display Flex</h1>

    <div class="container-flex">

      <div>07</div>
      <div>08</div>
      <div>09</div>
      <div>10</div>
      <div>11</div>
      <div>12</div>
      <div>13</div>
      <div>14</div>
      <div>15</div>
      <div>16</div>
      <div>17</div>
      <div>18</div>
      <div>19</div>
      <div>20</div>
    </div>
  </body>
</html>
