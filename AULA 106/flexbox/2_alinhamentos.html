<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alinhamentos</title>
    <style>
      body {
        background-color: black;
      }
      .container-flex {
        font-size: 2rem;
        border: 4px solid blue;
        display: flex;
        width: 300px;
        height: 300px;
        flex-direction: row;
        justify-content: center;

        flex-wrap: wrap;
        align-content: space-evenly;
      }
      .container-flex > div {
        border: 4px solid white;
        color: white;
        padding: 4px;
        margin: 4px;
      }
      h1 {
        color: wheat;
      }
      .coluna {
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <h1>Row</h1>

    <div class="container-flex">
      <div>01</div>
      <div>02</div>
      <div>03</div>
      <div>04</div>
      <div>05</div>
      <div>06</div>
      <div>07</div>
      <div>08</div>
      <div>09</div>
      <div>10</div>
    </div>
    <h1>Column</h1>

    <div class="container-flex coluna">
      <div>01</div>
      <div>02</div>
      <div>03</div>
      <div>04</div>
      <div>05</div>
      <div>06</div>
      <div>07</div>
      <div>08</div>
      <div>09</div>
      <div>10</div>
    </div>
  </body>
</html>
