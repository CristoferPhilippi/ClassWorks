<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>
    <style>
      body {
        background-color: black;
      }
      .container-flex {
        font-size: 2rem;
        border: 4px solid blue;
        display: flex;

        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
      }

      .container-flex > div {
        border: 4px solid white;
        color: white;
        padding: 4px;
        margin: 4px;
      }
      h1 {
        color: wheat;
      }
      .coluna {
        flex-direction: column;
        height: 400px;
      }
      .item2,
      .item4 {
        /* flex-shrink: 1;
        flex-grow: 1;
        flex-basis: 200px;*/
        flex: 1 1 200px;
      }

      .item1,
      .item3 {
        /*flex-shrink: 2;
        flex-grow: 2;
        flex-basis: 200px;*/
        flex: 2 2 200px;
      }
    </style>
  </head>
  <body>
    <h1>Row</h1>

    <div class="container-flex">
      <div class="item1">01</div>
      <div class="item2">02</div>
      <div class="item3">03</div>
      <div class="item4">04</div>
    </div>
    <h1>Column</h1>

    <div class="container-flex coluna">
      <div class="item1">01</div>
      <div class="item2">02</div>
      <div class="item3">03</div>
      <div class="item4">04</div>
    </div>
  </body>
</html>
