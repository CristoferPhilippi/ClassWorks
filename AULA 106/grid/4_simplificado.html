<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Mesclar</title>
    <style>
      body {
        font-size: 3rem;
        background-color: black;
        margin: 0;
        padding: 20px;
        color: white;
      }
      .grid {
        row-gap: 20px;
        column-gap: 20px;
        /* height: 100vh; */
        display: grid;
        grid-template-columns: [inicio] repeat(3, 1fr) [fim];
      }

      .grid > div {
        border: 3px solid yellowgreen;
      }
      .item2 {
        grid-column: span 2;
      }
      .item3 {
        grid-column: span 2;
      }
      .item4 {
        grid-row: span 2;
      }
      .item7 {
        grid-column: span 3;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="item1">1</div>
      <div class="item2">2</div>
      <div class="item3">3</div>
      <div class="item4">4</div>
      <div class="item5">5</div>
      <div class="item6">6</div>
      <div class="item7">7</div>
    </div>
  </body>
</html>
